# Deck Spec de ejemplo — cubre los 10 tipos de slide del esquema (Hito 4) y las
# 8 primitivas visuales de planning/09-visual-richness-and-content-density.md.
# Criterio de aceptación: node scripts/validate-deck-spec.mjs tests/schema/example-deck.yaml -> VÁLIDO
schemaVersion: "0.1.0"

presentation:
  title: "Resultados institucionales 2025"
  audience: "Consejo Directivo"
  density: low
  palette: institutional

slides:
  - id: cover-01
    type: cover
    title: "La Universidad consolidó su crecimiento en investigación durante 2025"
    subtitle: "Informe de resultados ante el Consejo Directivo"
    eyebrow: "INFORME ANUAL"
    background: photo
    photo: assets/campus-2.jpg
    presenter: "Rectoría"
    date: "noviembre de 2025"

  - id: agenda-01
    type: agenda
    title: "Agenda"
    items:
      - "Contexto institucional"
      - "Resultados financieros"
      - "Resultados de investigación"
      - "Comparación entre facultades"
      - "Cierre y próximos pasos"

  - id: agenda-02
    type: agenda
    title: "Agenda (variante grid)"
    layout: grid
    background: tinted
    items:
      - "Contexto institucional"
      - "Resultados financieros"
      - "Resultados de investigación"
      - "Comparación entre facultades"
      - "Cierre y próximos pasos"

  - id: separator-01
    type: separator
    sectionNumber: "01"
    title: "Contexto institucional"
    descriptor: "Panorama general 2025"

  - id: message-01
    type: message
    title: "La Universidad fortaleció su posición académica regional"
    supporting: "El crecimiento se sostuvo en investigación, internacionalización y bienestar estudiantil."
    banner:
      variant: info
      label: "PUNTO DE PARTIDA"
      text: "Arrancamos el periodo con una brecha de 12 puntos frente a la meta institucional."

  - id: data-01
    type: data
    title: "Los ingresos operacionales crecieron 18% frente a 2024"
    stats:
      - value: "18%"
        label: "Crecimiento de ingresos"
        delta: "2.4 pts"
        deltaDirection: up
        caption: "Frente al año anterior"
      - value: "1,240"
        label: "Nuevos estudiantes matriculados"
      - value: "-4%"
        label: "Deserción en primer semestre"
        deltaDirection: down
        accent: alert
        badge: "Requiere atención"
    source: "Vicerrectoría Financiera"
    period: "2025"
    banner:
      variant: warning
      label: "NOTA"
      text: "Las cifras de matrícula excluyen programas de posgrado a distancia."
      icon: triangle-alert
    progress:
      value: 72
      label: "Avance frente a la meta anual de ingresos"

  - id: comparison-01
    type: comparison
    title: "Ingeniería y Medicina lideraron el crecimiento en proyectos de investigación"
    background: tinted
    columns:
      - heading: "Facultad de Ingeniería"
        accent: neutral
        badge: "Líder en crecimiento"
        stats:
          - value: "32"
            label: "Proyectos activos"
          - value: "12"
            label: "Publicaciones indexadas"
        points:
          - "32 proyectos activos"
          - "12 publicaciones indexadas"
      - heading: "Facultad de Medicina"
        accent: alert
        badge: "Publicaciones bajo la meta"
        stats:
          - value: "28"
            label: "Proyectos activos"
          - value: "19"
            label: "Publicaciones indexadas"
        points:
          - "28 proyectos activos"
          - "19 publicaciones indexadas"

  - id: process-01
    type: process
    title: "El proceso de acreditación avanzó en cuatro etapas"
    banner:
      variant: highlight
      text: "La visita de verificación concentra el 40% del esfuerzo total del proceso."
    steps:
      - label: "Autoevaluación"
        description: "Recolección de evidencia por programa"
      - label: "Revisión por pares"
      - label: "Informe final"
      - label: "Visita de verificación"

  - id: process-alt
    type: process
    title: "Fases del proceso de acreditación (variante alternada)"
    layout: alternating
    steps:
      - label: "Autoevaluación"
        description: "Recolección de evidencia por programa"
        icon: file-text
      - label: "Revisión por pares"
        description: "Visita de pares académicos externos"
        icon: users
        current: true
      - label: "Informe final"
        description: "Consolidación de hallazgos"
        icon: check
      - label: "Visita de verificación"
        description: "Confirmación institucional"
        icon: calendar

  - id: process-gantt
    type: process
    title: "Cronograma del proceso de acreditación"
    layout: gantt
    lanes:
      - label: "Autoevaluación"
        start: "2026-01"
        end: "2026-03"
      - label: "Revisión por pares"
        start: "2026-03"
        end: "2026-05"
      - label: "Informe final"
        start: "2026-05"
        end: "2026-06"
      - label: "Visita de verificación"
        start: "2026-06-15"
        end: "2026-07-15"
    milestones:
      - label: "Kickoff"
        date: "2026-01-05"
      - label: "Entrega parcial"
        date: "2026-04-15"
    asOf: "2026-04-01"
    banner:
      variant: warning
      label: "NOTA"
      text: "La visita de verificación depende de la disponibilidad del par externo."
      icon: triangle-alert

  - id: table-01
    type: table
    title: "Indicadores por facultad"
    density: high
    columns: ["Facultad", "Estudiantes", "Proyectos", "Publicaciones"]
    rows:
      - ["Ingeniería", "1,850", "32", "12"]
      - ["Medicina", "1,420", "28", "19"]
      - ["Educación", "980", "14", "7"]
    highlightCells:
      - [0, 2]
      - [1, 3]

  - id: quote-01
    type: quote
    text: "La investigación aplicada es el puente entre el conocimiento y el bienestar de la sociedad."
    attribution: "Rectoría, Universidad de La Sabana"

  - id: closing-01
    type: closing
    title: "Seguimos construyendo una universidad que transforma su entorno"
    contact: "contacto@ejemplo.edu.co (dato ficticio de ejemplo)"
